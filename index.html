<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control de Presupuesto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mi Presupuesto</h1>
    </header>
    <main>
        <section id="resumen">
            <h2>Resumen Mensual</h2>
            <div id="resumen-container"></div>
        </section>
        <section id="lista-gastos">
            <h2>Mis Gastos</h2>
            <table>
                <thead>
                    <tr>
                        <th>Descripción</th>
                        <th>Categoría</th>
                        <th>Cuenta</th>
                        <th>Monto</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="gastos-tbody"></tbody>
            </table>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>

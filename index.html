<!DOCTYPE html>
<html lang="es">
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finanzas Core</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="notification-center" class="notification-center"></div>

    <div class="container">
        <header class="ios-header">
            <span class="date-sub">Presupuesto Activo</span>
            <h1>Mis Finanzas</h1>
        </header>

        <section class="widgets-grid">
            <div class="card widget income">
                <h3>Ingresos</h3>
                <p id="total-income">2.800,00€</p>
            </div>
            <div class="card widget expenses">
                <h3>Gastos</h3>
                <p id="total-expenses">0,00€</p>
            </div>
            <div class="card widget balance">
                <h3>Sobrante</h3>
                <p id="total-balance">0,00€</p>
            </div>
        </section>

        <section class="main-content">
            <div class="section-title">
                <h2>Control de Pagos</h2>
                <span id="pending-count" class="badge">0 pendientes</span>
            </div>
            
            <div class="card list-container" id="payments-list">
                </div>
        </section>
    </div>

    <nav class="tab-bar">
        <button class="tab-item active">
            <span class="icon">📊</span>
            <span class="tab-label">Resumen</span>
        </button>
        <button class="tab-item" onclick="requestWebNotifications()">
            <span class="icon">🔔</span>
            <span class="tab-label">Alertas</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>

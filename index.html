<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FinFlow — Control de Pagos</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #14171f;
    --surface2: #1c2030;
    --border: #252a3a;
    --accent: #5b8cf7;
    --accent2: #f7a25b;
    --accent3: #5bf7b0;
    --danger: #f75b6e;
    --warn: #f7d65b;
    --text: #e8eaf2;
    --muted: #6b7290;
    --font-display: 'DM Serif Display', serif;
    --font-body: 'DM Sans', sans-serif;
    --radius: 14px;
    --radius-sm: 8px;
  }

- { box-sizing: border-box; margin: 0; padding: 0; }

body {
background: var(–bg);
color: var(–text);
font-family: var(–font-body);
font-size: 14px;
min-height: 100vh;
overflow-x: hidden;
}

/* Background texture */
body::before {
content: ‘’;
position: fixed;
inset: 0;
background: radial-gradient(ellipse 80% 60% at 20% -10%, #1a2a5e33 0%, transparent 60%),
radial-gradient(ellipse 60% 50% at 80% 110%, #3a1a5e22 0%, transparent 60%);
pointer-events: none;
z-index: 0;
}

#app { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 24px 16px; }

/* HEADER */
header {
display: flex; align-items: center; justify-content: space-between;
margin-bottom: 32px;
}
.logo { font-family: var(–font-display); font-size: 28px; color: var(–text); }
.logo span { color: var(–accent); font-style: italic; }
.header-actions { display: flex; gap: 10px; align-items: center; }

/* SUMMARY CARDS */
.summary-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
gap: 14px;
margin-bottom: 28px;
}
.summary-card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: var(–radius);
padding: 20px;
position: relative;
overflow: hidden;
transition: transform .2s, border-color .2s;
}
.summary-card:hover { transform: translateY(-2px); border-color: var(–accent); }
.summary-card::after {
content: ‘’;
position: absolute; inset: 0;
background: linear-gradient(135deg, rgba(255,255,255,.03) 0%, transparent 60%);
pointer-events: none;
}
.sc-label { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(–muted); margin-bottom: 8px; }
.sc-value { font-family: var(–font-display); font-size: 26px; }
.sc-value.accent { color: var(–accent); }
.sc-value.danger { color: var(–danger); }
.sc-value.warn { color: var(–warn); }
.sc-value.ok { color: var(–accent3); }
.sc-sub { font-size: 12px; color: var(–muted); margin-top: 4px; }

/* MAIN GRID */
.main-grid {
display: grid;
grid-template-columns: 1fr 340px;
gap: 20px;
}
@media (max-width: 800px) {
.main-grid { grid-template-columns: 1fr; }
}

/* PANEL */
.panel {
background: var(–surface);
border: 1px solid var(–border);
border-radius: var(–radius);
overflow: hidden;
}
.panel-header {
padding: 16px 20px;
border-bottom: 1px solid var(–border);
display: flex; align-items: center; justify-content: space-between;
}
.panel-title { font-family: var(–font-display); font-size: 18px; }
.panel-body { padding: 16px 20px; }

/* TABS */
.tabs { display: flex; gap: 4px; background: var(–bg); border-radius: var(–radius-sm); padding: 4px; }
.tab {
padding: 6px 14px; border-radius: 6px; border: none;
background: transparent; color: var(–muted);
font-family: var(–font-body); font-size: 13px; cursor: pointer;
transition: all .2s;
}
.tab.active { background: var(–surface2); color: var(–text); }

/* PAYMENT LIST */
.payment-list { display: flex; flex-direction: column; gap: 10px; }
.payment-item {
background: var(–surface2);
border: 1px solid var(–border);
border-radius: var(–radius-sm);
padding: 14px 16px;
display: flex; align-items: center; gap: 14px;
transition: border-color .2s, transform .15s;
cursor: default;
}
.payment-item:hover { border-color: var(–accent); transform: translateX(3px); }
.payment-item.overdue { border-left: 3px solid var(–danger); }
.payment-item.soon { border-left: 3px solid var(–warn); }
.payment-item.paid { opacity: .5; }
.pi-icon {
width: 36px; height: 36px; border-radius: 10px;
display: flex; align-items: center; justify-content: center;
font-size: 18px; flex-shrink: 0;
}
.pi-info { flex: 1; min-width: 0; }
.pi-name { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pi-meta { font-size: 12px; color: var(–muted); margin-top: 2px; }
.pi-amount { font-family: var(–font-display); font-size: 18px; flex-shrink: 0; }
.pi-actions { display: flex; gap: 6px; flex-shrink: 0; }
.pi-badge {
font-size: 10px; padding: 2px 8px; border-radius: 20px;
font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
}
.badge-overdue { background: #f75b6e22; color: var(–danger); border: 1px solid #f75b6e44; }
.badge-soon { background: #f7d65b22; color: var(–warn); border: 1px solid #f7d65b44; }
.badge-ok { background: #5bf7b022; color: var(–accent3); border: 1px solid #5bf7b044; }
.badge-paid { background: #6b729022; color: var(–muted); border: 1px solid var(–border); }

/* CATEGORY COLORS */
.cat-fixed { background: #5b8cf722; }
.cat-sub { background: #a25bf722; }
.cat-loan { background: #f7a25b22; }
.cat-misc { background: #5bf7b022; }

/* CALENDAR */
.calendar { }
.cal-nav {
display: flex; align-items: center; justify-content: space-between;
margin-bottom: 14px;
}
.cal-month { font-family: var(–font-display); font-size: 18px; }
.cal-grid {
display: grid; grid-template-columns: repeat(7, 1fr);
gap: 4px;
}
.cal-dow {
text-align: center; font-size: 10px; color: var(–muted);
text-transform: uppercase; letter-spacing: .1em; padding: 4px 0;
}
.cal-day {
aspect-ratio: 1; border-radius: 8px;
display: flex; flex-direction: column; align-items: center; justify-content: center;
font-size: 13px; cursor: pointer; transition: background .15s;
position: relative; padding: 2px;
background: transparent; border: 1px solid transparent;
}
.cal-day:hover { background: var(–surface2); }
.cal-day.other-month { color: var(–muted); }
.cal-day.today { border-color: var(–accent); color: var(–accent); font-weight: 600; }
.cal-day.selected { background: var(–accent); color: white; }
.cal-day.selected:hover { background: var(–accent); }
.cal-day.has-payments::after {
content: ‘’;
width: 4px; height: 4px; border-radius: 50%;
background: var(–accent2);
position: absolute; bottom: 4px;
}
.cal-day.has-overdue::after { background: var(–danger); }

/* SELECTED DAY */
.selected-day-panel { margin-top: 16px; }
.sdp-title { font-size: 12px; color: var(–muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
.sdp-empty { color: var(–muted); font-size: 13px; text-align: center; padding: 16px 0; }

/* NOTIFICATION BANNER */
.notif-bar {
position: fixed; top: 16px; right: 16px; z-index: 999;
display: flex; flex-direction: column; gap: 8px;
max-width: 320px;
}
.notif {
background: var(–surface);
border: 1px solid var(–border);
border-left: 3px solid var(–accent);
border-radius: var(–radius-sm);
padding: 12px 16px;
animation: slideIn .3s ease;
display: flex; gap: 10px; align-items: flex-start;
box-shadow: 0 8px 32px #00000066;
}
.notif.danger { border-left-color: var(–danger); }
.notif.warn { border-left-color: var(–warn); }
.notif-close { margin-left: auto; cursor: pointer; color: var(–muted); background: none; border: none; font-size: 16px; }
@keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }

/* BUTTONS */
.btn {
padding: 8px 16px; border-radius: var(–radius-sm); border: none;
font-family: var(–font-body); font-size: 13px; font-weight: 500;
cursor: pointer; transition: all .2s; display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary { background: var(–accent); color: white; }
.btn-primary:hover { background: #4a7be6; }
.btn-ghost { background: transparent; color: var(–muted); border: 1px solid var(–border); }
.btn-ghost:hover { color: var(–text); border-color: var(–accent); }
.btn-icon { padding: 6px 8px; }
.btn-danger { background: #f75b6e22; color: var(–danger); border: 1px solid #f75b6e33; }
.btn-danger:hover { background: #f75b6e44; }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* MODAL */
.modal-overlay {
position: fixed; inset: 0; background: #00000088; z-index: 100;
display: flex; align-items: center; justify-content: center;
backdrop-filter: blur(4px);
animation: fadeIn .2s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
background: var(–surface);
border: 1px solid var(–border);
border-radius: var(–radius);
padding: 28px;
width: 100%; max-width: 440px;
animation: popIn .25s ease;
max-height: 90vh; overflow-y: auto;
}
@keyframes popIn { from { opacity: 0; transform: scale(.95) translateY(10px); } to { opacity: 1; transform: none; } }
.modal-title { font-family: var(–font-display); font-size: 22px; margin-bottom: 20px; }

/* FORM */
.form-group { margin-bottom: 16px; }
.form-label { font-size: 12px; color: var(–muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; display: block; }
.form-input {
width: 100%; padding: 10px 14px;
background: var(–surface2); border: 1px solid var(–border);
border-radius: var(–radius-sm); color: var(–text);
font-family: var(–font-body); font-size: 14px;
transition: border-color .2s; outline: none;
}
.form-input:focus { border-color: var(–accent); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

/* FILTER BAR */
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.filter-chip {
padding: 5px 12px; border-radius: 20px; border: 1px solid var(–border);
background: transparent; color: var(–muted); font-family: var(–font-body);
font-size: 12px; cursor: pointer; transition: all .15s;
}
.filter-chip.active { background: var(–accent); color: white; border-color: var(–accent); }

/* EMPTY STATE */
.empty-state { text-align: center; padding: 40px 20px; color: var(–muted); }
.empty-state .emoji { font-size: 36px; margin-bottom: 12px; }
.empty-state p { font-size: 13px; line-height: 1.6; }

/* SCROLLBAR */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(–bg); }
::-webkit-scrollbar-thumb { background: var(–border); border-radius: 3px; }

.month-total {
background: var(–surface2); border-radius: var(–radius-sm);
padding: 10px 14px; font-size: 13px;
display: flex; justify-content: space-between; align-items: center;
margin-bottom: 14px; border: 1px solid var(–border);
}

.recurring-badge {
font-size: 10px; padding: 1px 6px; border-radius: 20px;
background: #5b8cf722; color: var(–accent); border: 1px solid #5b8cf744;
margin-left: 6px;
}
</style>

</head>

<script>
// ─── STATE ─────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'finflow_payments';

const CAT_META = {
  fixed: { label: 'Factura fija', emoji: '🏠', cls: 'cat-fixed' },
  sub:   { label: 'Suscripción',  emoji: '📺', cls: 'cat-sub'   },
  loan:  { label: 'Préstamo',     emoji: '💳', cls: 'cat-loan'  },
  misc:  { label: 'Varios',       emoji: '📌', cls: 'cat-misc'  },
};

let payments = [];
let editingId = null;
let calYear, calMonth;
let selectedDay = null;
let activeTab = 'all';
let activeCat = 'all';

function loadData() {
  try { payments = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { payments = []; }
}
function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(payments));
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

// ─── DATE HELPERS ──────────────────────────────────────────────────────────
const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const todayDate = () => new Date(today());
const parseDate = s => new Date(s + 'T00:00:00');
const diffDays = (a, b) => Math.round((parseDate(a) - b) / 86400000);

function statusOf(p) {
  if (p.paid) return 'paid';
  const d = diffDays(p.date, todayDate());
  if (d < 0) return 'overdue';
  if (d <= p.alertDays) return 'soon';
  return 'ok';
}

// ─── RENDER SUMMARY ────────────────────────────────────────────────────────
function renderSummary() {
  const now = today();
  const thisMonth = now.slice(0,7);
  const monthPayments = payments.filter(p => p.date.startsWith(thisMonth));
  const totalMonth = monthPayments.reduce((s,p) => s + p.amount, 0);
  const pending = payments.filter(p => !p.paid && statusOf(p) !== 'overdue');
  const overdue = payments.filter(p => statusOf(p) === 'overdue');
  const paid = payments.filter(p => p.paid);

  const el = document.getElementById('summary-grid');
  el.innerHTML = `
    <div class="summary-card"><div class="sc-label">Total este mes</div><div class="sc-value accent">${fmt(totalMonth)}</div><div class="sc-sub">${monthPayments.length} pagos</div></div>
    <div class="summary-card"><div class="sc-label">Pendientes</div><div class="sc-value warn">${pending.length}</div><div class="sc-sub">${fmt(pending.reduce((s,p)=>s+p.amount,0))}</div></div>
    <div class="summary-card"><div class="sc-label">Vencidos</div><div class="sc-value danger">${overdue.length}</div><div class="sc-sub">${fmt(overdue.reduce((s,p)=>s+p.amount,0))}</div></div>
    <div class="summary-card"><div class="sc-label">Pagados</div><div class="sc-value ok">${paid.length}</div><div class="sc-sub">${fmt(paid.reduce((s,p)=>s+p.amount,0))}</div></div>
  `;
}

const fmt = n => new Intl.NumberFormat('es-ES', { style:'currency', currency:'EUR' }).format(n);

// ─── RENDER PAYMENT LIST ───────────────────────────────────────────────────
function renderList() {
  let list = [...payments];

  // Tab filter
  if (activeTab === 'pending') list = list.filter(p => !p.paid);
  if (activeTab === 'paid')    list = list.filter(p => p.paid);

  // Category filter
  if (activeCat !== 'all') list = list.filter(p => p.cat === activeCat);

  // Sort by date
  list.sort((a,b) => a.date.localeCompare(b.date));

  const el = document.getElementById('payment-list');
  if (!list.length) {
    el.innerHTML = `<div class="empty-state"><div class="emoji">💸</div><p>No hay pagos aquí todavía.<br>Pulsa <strong>+ Añadir pago</strong> para empezar.</p></div>`;
    return;
  }

  el.innerHTML = list.map(p => {
    const st = statusOf(p);
    const m = CAT_META[p.cat];
    const d = diffDays(p.date, todayDate());
    let dLabel = '';
    if (!p.paid) {
      if (st === 'overdue') dLabel = `Venció hace ${Math.abs(d)} día${Math.abs(d)!==1?'s':''}`;
      else if (d === 0) dLabel = 'Vence hoy';
      else dLabel = `Vence en ${d} día${d!==1?'s':''}`;
    } else { dLabel = 'Pagado'; }

    let badge = '';
    if (st === 'overdue') badge = `<span class="pi-badge badge-overdue">Vencido</span>`;
    else if (st === 'soon') badge = `<span class="pi-badge badge-soon">Pronto</span>`;
    else if (st === 'paid') badge = `<span class="pi-badge badge-paid">Pagado</span>`;
    else badge = `<span class="pi-badge badge-ok">OK</span>`;

    const recurBadge = p.recur !== 'none' ? `<span class="recurring-badge">↻</span>` : '';

    return `<div class="payment-item ${st}" data-id="${p.id}">
      <div class="pi-icon ${m.cls}">${m.emoji}</div>
      <div class="pi-info">
        <div class="pi-name">${p.name}${recurBadge}</div>
        <div class="pi-meta">${formatDateDisplay(p.date)} · ${dLabel}</div>
        ${p.notes ? `<div class="pi-meta">${p.notes}</div>` : ''}
      </div>
      <div class="pi-amount">${fmt(p.amount)}</div>
      <div class="pi-actions">
        ${badge}
        ${!p.paid ? `<button class="btn btn-ghost btn-sm btn-icon" title="Marcar pagado" onclick="markPaid('${p.id}')">✓</button>` : ''}
        <button class="btn btn-ghost btn-sm btn-icon" title="Editar" onclick="openEdit('${p.id}')">✎</button>
        <button class="btn btn-danger btn-sm btn-icon" title="Eliminar" onclick="deletePayment('${p.id}')">✕</button>
      </div>
    </div>`;
  }).join('');
}

function formatDateDisplay(s) {
  const d = parseDate(s);
  return d.toLocaleDateString('es-ES', { day:'numeric', month:'short', year:'numeric' });
}

// ─── CALENDAR ──────────────────────────────────────────────────────────────
function renderCalendar() {
  const label = new Date(calYear, calMonth).toLocaleDateString('es-ES', { month:'long', year:'numeric' });
  document.getElementById('cal-month-label').textContent = label.charAt(0).toUpperCase() + label.slice(1);

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  const dows = ['Lu','Ma','Mi','Ju','Vi','Sá','Do'];
  dows.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow'; el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(calYear, calMonth, 1);
  let startDow = firstDay.getDay(); // 0=Sun
  startDow = startDow === 0 ? 6 : startDow - 1; // Mon=0

  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrev  = new Date(calYear, calMonth, 0).getDate();

  const todayStr = today();

  // Build payment map for this month
  const pmMap = {};
  payments.forEach(p => {
    if (!pmMap[p.date]) pmMap[p.date] = [];
    pmMap[p.date].push(p);
  });

  let cells = [];
  // Prev month days
  for (let i = startDow - 1; i >= 0; i--) {
    cells.push({ day: daysInPrev - i, month: calMonth - 1, year: calYear, other: true });
  }
  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({ day: d, month: calMonth, year: calYear, other: false });
  }
  // Next month
  let next = 1;
  while (cells.length % 7 !== 0) {
    cells.push({ day: next++, month: calMonth + 1, year: calYear, other: true });
  }

  cells.forEach(c => {
    const dateStr = `${c.year}-${String(c.month+1).padStart(2,'0')}-${String(c.day).padStart(2,'0')}`;
    const ps = pmMap[dateStr] || [];
    const hasOverdue = ps.some(p => statusOf(p) === 'overdue');
    const hasPayments = ps.length > 0;

    const el = document.createElement('div');
    el.className = 'cal-day'
      + (c.other ? ' other-month' : '')
      + (dateStr === todayStr ? ' today' : '')
      + (dateStr === selectedDay ? ' selected' : '')
      + (hasOverdue ? ' has-overdue' : hasPayments ? ' has-payments' : '');
    el.textContent = c.day;
    el.addEventListener('click', () => selectDay(dateStr));
    grid.appendChild(el);
  });

  renderSelectedDay();
}

function selectDay(dateStr) {
  selectedDay = dateStr;
  renderCalendar();
}

function renderSelectedDay() {
  const el = document.getElementById('selected-day-panel');
  if (!selectedDay) { el.innerHTML = ''; return; }

  const ps = payments.filter(p => p.date === selectedDay);
  const label = parseDate(selectedDay).toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' });
  const total = ps.reduce((s,p) => s+p.amount, 0);

  let html = `<div class="sdp-title">${label}</div>`;

  if (!ps.length) {
    html += `<div class="sdp-empty">Sin pagos este día 🎉</div>`;
  } else {
    html += `<div class="month-total"><span>${ps.length} pago${ps.length!==1?'s':''}</span><span style="font-family:var(--font-display)">${fmt(total)}</span></div>`;
    ps.forEach(p => {
      const m = CAT_META[p.cat];
      html += `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
        <div class="pi-icon ${m.cls}" style="width:28px;height:28px;border-radius:8px;font-size:14px">${m.emoji}</div>
        <div style="flex:1;font-size:13px">${p.name}</div>
        <div style="font-family:var(--font-display);font-size:16px">${fmt(p.amount)}</div>
      </div>`;
    });
  }

  el.innerHTML = html;
}

// ─── MODAL ─────────────────────────────────────────────────────────────────
function openModal(id = null) {
  editingId = id;
  const modal = document.getElementById('modal-overlay');
  const title = document.getElementById('modal-title');

  if (id) {
    const p = payments.find(x => x.id === id);
    title.textContent = 'Editar pago';
    document.getElementById('f-name').value = p.name;
    document.getElementById('f-amount').value = p.amount;
    document.getElementById('f-cat').value = p.cat;
    document.getElementById('f-date').value = p.date;
    document.getElementById('f-alert').value = p.alertDays;
    document.getElementById('f-recur').value = p.recur;
    document.getElementById('f-notes').value = p.notes || '';
  } else {
    title.textContent = 'Nuevo pago';
    document.getElementById('f-name').value = '';
    document.getElementById('f-amount').value = '';
    document.getElementById('f-cat').value = 'fixed';
    document.getElementById('f-date').value = today();
    document.getElementById('f-alert').value = 3;
    document.getElementById('f-recur').value = 'none';
    document.getElementById('f-notes').value = '';
  }

  modal.style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal-overlay').style.display = 'none';
  editingId = null;
}

function savePayment() {
  const name   = document.getElementById('f-name').value.trim();
  const amount = parseFloat(document.getElementById('f-amount').value);
  const cat    = document.getElementById('f-cat').value;
  const date   = document.getElementById('f-date').value;
  const alert  = parseInt(document.getElementById('f-alert').value) || 0;
  const recur  = document.getElementById('f-recur').value;
  const notes  = document.getElementById('f-notes').value.trim();

  if (!name || isNaN(amount) || !date) {
    showNotif('⚠️ Por favor completa los campos obligatorios.', 'warn');
    return;
  }

  if (editingId) {
    const idx = payments.findIndex(x => x.id === editingId);
    payments[idx] = { ...payments[idx], name, amount, cat, date, alertDays: alert, recur, notes };
  } else {
    payments.push({ id: uid(), name, amount, cat, date, alertDays: alert, recur, notes, paid: false });
  }

  saveData();
  closeModal();
  render();
  showNotif(`✅ Pago "${name}" guardado correctamente.`, 'ok');
}

// ─── ACTIONS ───────────────────────────────────────────────────────────────
function markPaid(id) {
  const p = payments.find(x => x.id === id);
  if (p) { p.paid = !p.paid; saveData(); render(); }
}

function openEdit(id) { openModal(id); }

function deletePayment(id) {
  const p = payments.find(x => x.id === id);
  if (!p) return;
  if (!confirm(`¿Eliminar "${p.name}"?`)) return;
  payments = payments.filter(x => x.id !== id);
  saveData(); render();
}

// ─── NOTIFICATIONS ─────────────────────────────────────────────────────────
function showNotif(msg, type = 'info') {
  const bar = document.getElementById('notif-bar');
  const el = document.createElement('div');
  el.className = `notif ${type}`;
  el.innerHTML = `<span style="flex:1;font-size:13px;line-height:1.4">${msg}</span>
    <button class="notif-close" onclick="this.parentElement.remove()">×</button>`;
  bar.appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

async function requestPushPermission() {
  if (!('Notification' in window)) { showNotif('Tu navegador no soporta notificaciones push.', 'warn'); return; }
  const perm = await Notification.requestPermission();
  if (perm === 'granted') {
    showNotif('🔔 Notificaciones activadas.', 'ok');
    document.getElementById('btn-notif-perm').textContent = '🔔 Notificaciones activas';
    document.getElementById('btn-notif-perm').disabled = true;
  }
}

function sendPushNotif(title, body) {
  if (Notification.permission === 'granted') {
    new Notification(title, { body, icon: '' });
  }
}

function checkAlerts() {
  const now = todayDate();
  payments.forEach(p => {
    if (p.paid) return;
    const d = diffDays(p.date, now);
    if (d < 0) {
      showNotif(`🔴 <strong>${p.name}</strong> venció hace ${Math.abs(d)} día${Math.abs(d)!==1?'s':''}. (${fmt(p.amount)})`, 'danger');
      sendPushNotif('Pago vencido', `${p.name} — ${fmt(p.amount)}`);
    } else if (d <= p.alertDays) {
      showNotif(`🟡 <strong>${p.name}</strong> vence ${d === 0 ? 'hoy' : `en ${d} día${d!==1?'s':''}`}. (${fmt(p.amount)})`, 'warn');
      if (d === 0 || d === 1) sendPushNotif('Pago próximo', `${p.name} vence ${d===0?'hoy':'mañana'} — ${fmt(p.amount)}`);
    }
  });
}

// ─── TABS & FILTERS ────────────────────────────────────────────────────────
document.getElementById('tabs').addEventListener('click', e => {
  if (!e.target.dataset.tab) return;
  activeTab = e.target.dataset.tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === activeTab));
  renderList();
});

document.getElementById('filter-bar').addEventListener('click', e => {
  if (!e.target.dataset.cat) return;
  activeCat = e.target.dataset.cat;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.dataset.cat === activeCat));
  renderList();
});

// ─── CALENDAR NAV ──────────────────────────────────────────────────────────
document.getElementById('cal-prev').addEventListener('click', () => {
  calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
});
document.getElementById('cal-next').addEventListener('click', () => {
  calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
});

// ─── MODAL EVENTS ──────────────────────────────────────────────────────────
document.getElementById('btn-add').addEventListener('click', () => openModal());
document.getElementById('btn-modal-cancel').addEventListener('click', closeModal);
document.getElementById('btn-modal-save').addEventListener('click', savePayment);
document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.getElementById('btn-notif-perm').addEventListener('click', requestPushPermission);

// ─── RENDER ALL ─────────────────────────────────────────────────────────────
function render() {
  renderSummary();
  renderList();
  renderCalendar();
}

// ─── SEED DATA ─────────────────────────────────────────────────────────────
function seedIfEmpty() {
  if (payments.length) return;
  const t = today();
  const [y, m] = t.split('-').map(Number);
  const pad = n => String(n).padStart(2,'0');

  payments = [
    { id: uid(), name: 'Netflix', amount: 17.99, cat: 'sub', date: `${y}-${pad(m)}-${pad(5)}`, alertDays: 3, recur: 'monthly', notes: '', paid: false },
    { id: uid(), name: 'Spotify', amount: 10.99, cat: 'sub', date: `${y}-${pad(m)}-${pad(10)}`, alertDays: 3, recur: 'monthly', notes: '', paid: true },
    { id: uid(), name: 'Hipoteca', amount: 820, cat: 'loan', date: `${y}-${pad(m)}-${pad(28)}`, alertDays: 5, recur: 'monthly', notes: 'Banco Santander', paid: false },
    { id: uid(), name: 'Luz (Endesa)', amount: 65.40, cat: 'fixed', date: `${y}-${pad(m)}-${pad(18)}`, alertDays: 3, recur: 'monthly', notes: '', paid: false },
    { id: uid(), name: 'Internet', amount: 39.90, cat: 'fixed', date: `${y}-${pad(m)}-${pad(20)}`, alertDays: 2, recur: 'monthly', notes: 'Movistar fibra', paid: false },
    { id: uid(), name: 'Seguro coche', amount: 420, cat: 'misc', date: `${y}-${pad(m)}-${pad(30)}`, alertDays: 7, recur: 'yearly', notes: 'Mapfre', paid: false },
  ];
  saveData();
}

// ─── INIT ──────────────────────────────────────────────────────────────────
loadData();
seedIfEmpty();
const now = new Date();
calYear = now.getFullYear(); calMonth = now.getMonth();
render();
setTimeout(checkAlerts, 800);

// Check notification button state
if (Notification.permission === 'granted') {
  document.getElementById('btn-notif-perm').textContent = '🔔 Notificaciones activas';
  document.getElementById('btn-notif-perm').disabled = true;
}
</script>

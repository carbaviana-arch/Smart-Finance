<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finanzas Core</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="notification-center" class="notification-center"></div>

    <div class="container">
        <header class="ios-header">
            <span class="date-sub">Presupuesto Activo</span>
            <div class="header-main">
                <h1>Mis Finanzas</h1>
                <button class="btn-add" onclick="openModal()">＋</button>
            </div>
        </header>

        <section class="widgets-grid">
            <div class="card widget income" onclick="editIncome()">
                <h3>Ingresos <span>✏️</span></h3>
                <p id="total-income">2.800,00€</p>
            </div>
            <div class="card widget paid">
                <h3>Pagado</h3>
                <p id="total-paid">0,00€</p>
            </div>
            <div class="card widget pending">
                <h3>Pendiente</h3>
                <p id="total-pending">0,00€</p>
            </div>
        </section>

        <div class="card balance-strip">
            <span>Sobrante Total (Presupuestado):</span>
            <strong id="total-balance">0,00€</strong>
        </div>

        <section class="main-content">
            <div class="section-title">
                <h2>Control de Pagos</h2>
                <span id="pending-count" class="badge">0 pendientes</span>
            </div>
            
            <div class="card list-container" id="payments-list">
                </div>
        </section>
    </div>

    <div id="ios-modal" class="modal-overlay">
        <div class="modal-sheet">
            <div class="modal-header">
                <button class="btn-link" onclick="closeModal()">Cancelar</button>
                <h3 id="modal-title">Nuevo Gasto</h3>
                <button class="btn-link bold" onclick="savePayment()">Guardar</button>
            </div>
            <form id="payment-form" onsubmit="event.preventDefault();">
                <input type="hidden" id="edit-index" value="">
                
                <div class="form-group card">
                    <input type="text" id="form-pago" placeholder="Concepto (ej. Alquiler, Netflix)" required>
                    <input type="number" id="form-monto" step="0.01" placeholder="Monto (€)" required>
                </div>

                <div class="form-group card">
                    <div class="select-row">
                        <label for="form-propietario">Propietario</label>
                        <select id="form-propietario">
                            <option value="Casa">Casa</option>
                            <option value="Sebas">Sebas</option>
                            <option value="Francisco">Francisco</option>
                            <option value="Daysol">Daysol</option>
                        </select>
                    </div>
                    <div class="select-row">
                        <label for="form-prioridad">Prioridad</label>
                        <select id="form-prioridad">
                            <option value="Alta">Alta</option>
                            <option value="Media">Media</option>
                            <option value="Baja">Baja</option>
                        </select>
                    </div>
                    <div class="select-row">
                        <label for="form-fecha">Fecha Vencimiento</label>
                        <input type="date" id="form-fecha" required>
                    </div>
                    <div class="select-row">
                        <label for="form-estado">Estado</label>
                        <select id="form-estado">
                            <option value="Por Pagar">Por Pagar</option>
                            <option value="Pagado">Pagado</option>
                        </select>
                    </div>
                </div>

                <button type="button" id="btn-delete" class="btn-danger card" onclick="deletePayment()" style="display: none;">
                    Eliminar Gasto
                </button>
            </form>
        </div>
    </div>

    <nav class="tab-bar">
        <button class="tab-item active">
            <span class="icon">📊</span>
            <span class="tab-label">Resumen</span>
        </button>
        <button class="tab-item" onclick="requestWebNotifications()">
            <span class="icon">🔔</span>
            <span class="tab-label">Alertas</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>

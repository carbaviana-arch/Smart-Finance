<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e0e;--pn:#1c1c1c;--pn2:#262626;--line:#333;--tx:#f2f2f2;--mut:#9a9a9a;--or:#ff7a1a;--orl:#ffc499;--gr:#cfcfcf;--gr2:#6e6e6e;--r:18px}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#2a2a2a,var(--bg) 60%) fixed;color:var(--tx);font:400 16px/1.45 "Bricolage Grotesque",system-ui,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:22px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
h1{margin:0;font-size:clamp(2rem,5vw,3.2rem);line-height:1;font-weight:800;letter-spacing:-.02em}
h1 small{display:block;font-size:1.1rem;font-weight:400;color:var(--mut);letter-spacing:0;margin-top:4px}
.month{display:flex;align-items:center;gap:6px;background:var(--pn);border-radius:99px;padding:4px}
.month b{min-width:140px;text-align:center;text-transform:capitalize;font-weight:600}
button{font:inherit;cursor:pointer;border:0;border-radius:99px;background:var(--or);color:#161616;padding:8px 16px;font-weight:600}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--line);font-weight:400}
.month button{width:36px;height:36px;padding:0;background:var(--pn2);color:var(--tx)}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.card{background:var(--pn);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kpis{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:12px;margin-bottom:12px}
.kpi small{color:var(--mut);display:block}
.kpi strong{font-size:1.7rem;font-weight:600;display:block}
.kpi.main strong{font-size:2.8rem;font-weight:800;letter-spacing:-.02em}
.kpi em{font-style:normal;font-size:.85rem;color:var(--mut)}
.or{color:var(--or)}.gr{color:var(--gr)}
.grid{display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:12px;margin-bottom:12px}
.col{display:grid;gap:12px;align-content:start}
h2{font-size:1.15rem;margin:0;font-weight:800;color:var(--or)}
h2 span{font-weight:400;color:var(--mut);font-size:.82rem;margin-left:6px}
.sub{color:var(--mut);font-size:.85rem;margin:2px 0 10px}
.tag{text-align:right;font-weight:800;color:var(--or);font-size:.85rem;margin-top:6px}
.r{display:flex;align-items:center;gap:8px;font-size:.85rem;padding:3px 0}
.r .l{flex:0 0 36%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;color:var(--gr)}
.r .t{flex:1;height:14px;background:var(--pn2);border-radius:4px}
.r .t i{display:block;height:100%;border-radius:4px}
.r b{flex:0 0 66px;font-weight:600}
.none{color:var(--mut);font-size:.9rem;padding:6px 0}
svg{width:100%;height:auto;display:block}
svg g[data-m]{cursor:pointer}
svg text{font:11px "Bricolage Grotesque",sans-serif;fill:var(--mut)}
.donut{display:flex;align-items:center;gap:12px}
.donut svg{width:46%;flex:none}
.donut .lg{font-size:.85rem;display:grid;gap:6px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.mv{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mv .col{gap:12px}
ul{list-style:none;margin:6px 0;padding:0}
li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
li:last-child{border:0}
li .n{flex:1;min-width:0;overflow-wrap:anywhere}
li small{display:block;color:var(--mut);font-size:.78rem}
li button{background:none;color:var(--mut);padding:2px 8px;font-size:1.2rem}
li button:hover{color:var(--or)}
.empty{color:var(--mut);font-size:.9rem}
form{display:flex;gap:6px;margin-top:6px}
input,select{font:inherit;border:1px solid #3d3d3d;border-radius:10px;padding:8px 10px;min-width:0;background:var(--pn2);color:var(--tx)}
input[name=name]{flex:1}
input[name=amount]{width:92px}
.exp form button{background:var(--gr)}
footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center;color:var(--mut);font-size:.85rem}
@media(max-width:980px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.kpi.main{grid-column:1/-1}.mv{grid-template-columns:1fr}}
#informe{display:none}
@page{margin:16mm}
@media print{body{background:#fff!important;color:#111}.wrap{display:none}
#informe{display:block;font-size:12px;line-height:1.4}
#informe h1{font-size:22px;margin:0;color:#111}
#informe h1 small{color:#555;font-size:12px;margin-top:2px}
#informe h2{color:#c24a00;font-size:14px;margin:18px 0 6px}
#informe table{width:100%;border-collapse:collapse}
#informe th,#informe td{padding:5px 6px;border-bottom:1px solid #ddd;text-align:left}
#informe th{background:#f0f0f0}
#informe .d{text-align:right;white-space:nowrap}
#informe tfoot td{font-weight:700;border-top:2px solid #111}
#informe .res{display:flex;gap:10px;margin:12px 0}
#informe .res div{flex:1;border:1px solid #ccc;border-radius:8px;padding:8px}
#informe .res small{color:#555}
#informe .res b{display:block;font-size:16px}
#informe tr{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Dashboard<small>finanzas personales</small></h1>
    <div class="month" role="group" aria-label="Mes">
      <button id="prev" aria-label="Mes anterior">‹</button><b id="mlabel"></b><button id="next" aria-label="Mes siguiente">›</button>
    </div>
  </header>
  <section class="kpis" id="kpis" aria-live="polite"></section>
  <section class="grid" id="grid"></section>
  <section class="mv" id="mv"></section>
  <footer>
    <span id="st"></span>
    <select id="alc" aria-label="Alcance del informe"><option value="mes">Informe: mes seleccionado</option><option value="anio">Informe: año completo</option></select>
    <button class="ghost" id="pdf">Informe PDF</button>
    <button class="ghost" id="csv">Informe CSV</button>
    <button class="ghost" id="exp">Copia de seguridad</button>
    <button class="ghost" id="imp">Restaurar copia</button>
    <input type="file" id="file" accept="application/json" hidden>
  </footer>
</div>
<div id="informe" aria-hidden="true"></div>

<script>
const KEY = 'finanzas-v1';
const eur = new Intl.NumberFormat('es-ES', {style:'currency', currency:'EUR'});
const eur0 = new Intl.NumberFormat('es-ES', {style:'currency', currency:'EUR', maximumFractionDigits:0});
const mes = m => { const [y, n] = m.split('-'); return new Date(y, n - 1, 1).toLocaleDateString('es-ES', {month:'long', year:'numeric'}); };
const shift = (m, d) => { const [y, n] = m.split('-').map(Number); const t = new Date(y, n - 1 + d, 1); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0'); };
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const INI = 'EFMAMJJASOND';

// Almacenamiento local: todo se guarda en este dispositivo (localStorage)
let okStore = true;
try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { okStore = false; }
const valido = i => i && typeof i.name === 'string' && typeof i.amount === 'number' && /^\d{4}-\d{2}$/.test(i.month);
const leer = () => { try { const d = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(d) ? d.filter(valido) : []; } catch (e) { return []; } };
let items = leer();
const estado = () => {
  const el = document.getElementById('st');
  el.textContent = okStore ? 'Guardado en este dispositivo · ' + items.length + ' movimientos' : '⚠ Este navegador no permite guardar (¿modo privado?). Exporta una copia para no perder datos.';
  el.style.color = okStore ? '' : 'var(--or)';
};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); okStore = true; } catch (e) { okStore = false; } estado(); };
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
// Si abres la app en otra pestaña, se sincroniza sola
window.addEventListener('storage', e => { if (e.key === KEY) { items = leer(); render(); estado(); } });
const now = new Date();
let cur = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');

// Los fijos se repiten cada mes desde su alta (también se proyectan a meses futuros); los eventuales solo cuentan en su mes.
const activo = (it, m) => it.fijo ? it.month <= m : it.month === m;
const total = (tipo, m, fijo) => items.filter(i => i.tipo === tipo && activo(i, m) && (fijo === undefined || i.fijo === fijo)).reduce((s, i) => s + i.amount, 0);

const PANELES = [
  ['ingreso', true,  'Ingresos fijos',         'Nómina, alquileres…',        'inc'],
  ['gasto',   true,  'Gastos fijos',           'Hipoteca, recibos, cuotas…', 'exp'],
  ['ingreso', false, 'Ingresos eventuales',    'Extras de este mes',         'inc'],
  ['gasto',   false, 'Gastos extraordinarios', 'Imprevistos de este mes',    'exp']
];

// Columnas con línea superpuesta, como en la referencia
function chart(ms, vals, line, tit) {
  const W = 560, H = 210, top = 14, bot = 26, ph = H - top - bot;
  const all = [...vals, ...line, 0], mx = Math.max(...all), mn = Math.min(...all), rg = (mx - mn) || 1;
  const y = v => top + (mx - v) / rg * ph, z = y(0), st = W / 12, bw = st * .55;
  const g = ms.map((m, k) => {
    const v = vals[k], yy = y(v), sel = m === cur, x = k * st + (st - bw) / 2;
    return `<g data-m="${m}" tabindex="0" role="button" aria-label="${mes(m)}"><title>${mes(m)}: ${eur.format(v)}</title>
      <rect x="${k * st}" y="0" width="${st}" height="${H}" fill="${sel ? '#ffffff12' : 'transparent'}" rx="8"/>
      <rect x="${x}" y="${Math.min(yy, z)}" width="${bw}" height="${Math.max(1, Math.abs(yy - z))}" rx="3" fill="${v < 0 ? '#8a8a8a' : 'var(--or)'}" opacity="${sel ? 1 : .7}"/>
      <text x="${k * st + st / 2}" y="${H - 8}" text-anchor="middle" style="${sel ? 'fill:#fff;font-weight:600' : ''}">${INI[k]}</text></g>`;
  }).join('');
  const pts = line.map((v, k) => [k * st + st / 2, y(v)]);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${tit}">${g}
    <line x1="0" x2="${W}" y1="${z}" y2="${z}" stroke="#444" stroke-width="1"/>
    <polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--gr)" stroke-width="2" pointer-events="none"/>
    ${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--gr)" pointer-events="none"/>`).join('')}</svg>`;
}

// Ranking TOP 10 en barras horizontales
function top10(tipo, color, tit) {
  const l = items.filter(i => i.tipo === tipo && activo(i, cur)).sort((a, b) => b.amount - a.amount).slice(0, 10);
  const mx = l.length ? l[0].amount : 1;
  return `<div class="card"><h2>${tit}<span>${mes(cur)}</span></h2><p class="sub">Los mayores del mes</p>` +
    (l.length ? l.map(i => `<div class="r"><span class="l" title="${esc(i.name)}">${esc(i.name)}</span><div class="t"><i style="width:${i.amount / mx * 100}%;background:${color}"></i></div><b>${eur0.format(i.amount)}</b></div>`).join('') : '<div class="none">Aún no hay datos.</div>') +
    `<div class="tag">TOP 10 ${tipo === 'gasto' ? 'gastos' : 'ingresos'}</div></div>`;
}

// Anillo con porcentajes
function donut(tit, sub, a, b, ca, cb, la, lb) {
  const t = a + b, C = 2 * Math.PI * 40, fa = t ? a / t : 0;
  const seg = (f, off, c) => `<circle r="40" cx="60" cy="60" fill="none" stroke="${c}" stroke-width="20" stroke-dasharray="${f * C} ${C}" stroke-dashoffset="${-off * C}" transform="rotate(-90 60 60)"/>`;
  return `<div class="card"><h2>${tit}</h2><p class="sub">${sub}</p><div class="donut">
    <svg viewBox="0 0 120 120" role="img" aria-label="${la} ${Math.round(fa * 100)}%, ${lb} ${t ? 100 - Math.round(fa * 100) : 0}%"><circle r="40" cx="60" cy="60" fill="none" stroke="var(--pn2)" stroke-width="20"/>${t ? seg(fa, 0, ca) + seg(1 - fa, fa, cb) : ''}</svg>
    <div class="lg"><span><i style="background:${ca}"></i>${la}: <b>${t ? Math.round(fa * 100) : 0}%</b><br>${eur.format(a)}</span><span><i style="background:${cb}"></i>${lb}: <b>${t ? 100 - Math.round(fa * 100) : 0}%</b><br>${eur.format(b)}</span></div></div></div>`;
}

function render() {
  document.getElementById('mlabel').textContent = mes(cur);
  const y = cur.slice(0, 4), ms = Array.from({length: 12}, (_, k) => y + '-' + String(k + 1).padStart(2, '0'));
  const ing = total('ingreso', cur), gas = total('gasto', cur), bal = ing - gas, ahorro = ing > 0 ? Math.round(bal / ing * 100) : 0;
  document.getElementById('kpis').innerHTML = `
    <div class="card kpi main"><small>Balance del mes</small><strong class="${bal >= 0 ? 'or' : ''}">${eur.format(bal)}</strong><em>${bal >= 0 ? 'Superávit' : 'Déficit'}</em></div>
    <div class="card kpi"><small>Ingresos</small><strong class="or">${eur.format(ing)}</strong></div>
    <div class="card kpi"><small>Gastos</small><strong class="gr">${eur.format(gas)}</strong></div>
    <div class="card kpi"><small>Ahorro</small><strong>${ahorro}%</strong></div>`;

  const I = ms.map(m => total('ingreso', m)), G = ms.map(m => total('gasto', m)), B = I.map((v, k) => v - G[k]);
  const A = []; B.reduce((s, v) => (A.push(s + v), s + v), 0);
  document.getElementById('grid').innerHTML =
    `<div class="col">${top10('gasto', 'var(--gr)', 'Gastos')}${top10('ingreso', 'var(--or)', 'Ingresos')}</div>
    <div class="col">
      <div class="card"><h2>Ingresos vs. gastos<span>evolución ${y} · barras: ingresos, línea: gastos</span></h2><p class="sub">Pulsa un mes para verlo.</p>${chart(ms, I, G, 'Ingresos y gastos por mes')}</div>
      <div class="card"><h2>Balance<span>evolución ${y} · barras: mes, línea: acumulado</span></h2><p class="sub">Los fijos se proyectan a los meses futuros.</p>${chart(ms, B, A, 'Balance mensual y acumulado')}</div></div>
    <div class="col">${donut('Ingresos', 'Fijos y eventuales', total('ingreso', cur, true), total('ingreso', cur, false), 'var(--or)', 'var(--orl)', 'Fijos', 'Eventuales')}
      ${donut('Gastos', 'Fijos y extraordinarios', total('gasto', cur, true), total('gasto', cur, false), 'var(--gr)', 'var(--gr2)', 'Fijos', 'Extraordinarios')}</div>`;

  document.getElementById('mv').innerHTML = [0, 1].map(c => '<div class="col">' + [PANELES[c], PANELES[c + 2]].map(([tipo, fijo, titulo, ayuda, cls]) => {
    const l = items.filter(i => i.tipo === tipo && i.fijo === fijo && activo(i, cur)), t = l.reduce((s, i) => s + i.amount, 0);
    return `<div class="card ${cls}"><h2>${titulo}<span>${eur.format(t)}</span></h2><p class="sub">${ayuda}</p>
      <ul>${l.length ? l.map(i => `<li><div class="n">${esc(i.name)}${fijo ? `<small>desde ${mes(i.month)}</small>` : ''}</div><b>${eur.format(i.amount)}</b><button data-del="${i.id}" aria-label="Eliminar ${esc(i.name)}">×</button></li>`).join('') : '<li class="empty">Aún no hay nada.</li>'}</ul>
      <form data-tipo="${tipo}" data-fijo="${fijo}"><input name="name" placeholder="Concepto" required maxlength="60" aria-label="Concepto"><input name="amount" type="number" step="0.01" min="0.01" placeholder="€" required aria-label="Importe"><button>Añadir</button></form></div>`;
  }).join('') + '</div>').join('');
}

document.getElementById('prev').onclick = () => { cur = shift(cur, -1); render(); };
document.getElementById('next').onclick = () => { cur = shift(cur, 1); render(); };
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-tipo]'); if (!f) return;
  e.preventDefault();
  const amount = parseFloat(f.amount.value);
  if (!(amount > 0)) return;
  items.push({id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), tipo: f.dataset.tipo, fijo: f.dataset.fijo === 'true', name: f.name.value.trim(), amount, month: cur});
  save(); render();
});
document.addEventListener('click', e => {
  const d = e.target.closest('[data-del]');
  if (d) { items = items.filter(i => i.id !== d.dataset.del); save(); render(); return; }
  const g = e.target.closest('svg g[data-m]');
  if (g) { cur = g.dataset.m; render(); }
});
document.addEventListener('keydown', e => {
  const g = e.target.closest && e.target.closest('svg g[data-m]');
  if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); cur = g.dataset.m; render(); }
});
// ---- Informes: CSV (Excel) y PDF (vía impresión del navegador) ----
const rango = () => document.getElementById('alc').value;
const nomMes = m => new Date(m.split('-')[0], m.split('-')[1] - 1, 1).toLocaleDateString('es-ES', {month:'long'});
const nat = i => i.fijo ? 'Fijo' : (i.tipo === 'gasto' ? 'Extraordinario' : 'Eventual');
const num = v => v.toFixed(2).replace('.', ',');
const cel = v => { let t = String(v); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; return /[;"\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
const orden = (a, b) => (a.tipo === b.tipo ? 0 : a.tipo === 'ingreso' ? -1 : 1) || (b.fijo - a.fijo) || (b.amount - a.amount);
const mesesAnio = () => { const y = cur.slice(0, 4); return Array.from({length: 12}, (_, k) => y + '-' + String(k + 1).padStart(2, '0')); };

function informeCSV() {
  let filas, nombre;
  if (rango() === 'mes') {
    const ing = total('ingreso', cur), gas = total('gasto', cur);
    filas = [['Mes', 'Tipo', 'Naturaleza', 'Concepto', 'Importe (EUR)'].join(';')]
      .concat(items.filter(i => activo(i, cur)).sort(orden).map(i => [cur, i.tipo === 'ingreso' ? 'Ingreso' : 'Gasto', nat(i), cel(i.name), num(i.amount)].join(';')))
      .concat(['', ';;;Total ingresos;' + num(ing), ';;;Total gastos;' + num(gas), ';;;Balance;' + num(ing - gas)]);
    nombre = 'finanzas-informe-' + cur + '.csv';
  } else {
    filas = [['Mes', 'Ingresos fijos', 'Ingresos eventuales', 'Gastos fijos', 'Gastos extraordinarios', 'Total ingresos', 'Total gastos', 'Balance'].join(';')]
      .concat(mesesAnio().map(m => {
        const a = total('ingreso', m, true), b = total('ingreso', m, false), c = total('gasto', m, true), d = total('gasto', m, false);
        return [m, num(a), num(b), num(c), num(d), num(a + b), num(c + d), num(a + b - c - d)].join(';');
      }));
    nombre = 'finanzas-informe-' + cur.slice(0, 4) + '.csv';
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF' + filas.join('\r\n')], {type: 'text/csv;charset=utf-8'}));
  a.download = nombre; a.click(); URL.revokeObjectURL(a.href);
}

function informePDF() {
  const hoy = new Date().toLocaleDateString('es-ES', {day: 'numeric', month: 'long', year: 'numeric'});
  const caja = (t, v) => `<div><small>${t}</small><b>${v}</b></div>`;
  const pct = (b, i) => (i > 0 ? Math.round(b / i * 100) : 0) + '%';
  let h, tit, arch;
  if (rango() === 'mes') {
    const ing = total('ingreso', cur), gas = total('gasto', cur);
    tit = 'Informe de ' + mes(cur); arch = cur;
    h = `<div class="res">${caja('Ingresos', eur.format(ing))}${caja('Gastos', eur.format(gas))}${caja('Balance', eur.format(ing - gas))}${caja('Ahorro', pct(ing - gas, ing))}</div>` +
      [0, 2, 1, 3].map(k => {
        const [tipo, fijo, titulo] = PANELES[k];
        const l = items.filter(i => i.tipo === tipo && i.fijo === fijo && activo(i, cur)).sort((a, b) => b.amount - a.amount);
        const t = l.reduce((x, i) => x + i.amount, 0);
        return `<h2>${titulo}</h2><table><thead><tr><th>Concepto</th><th>Detalle</th><th class="d">Importe</th></tr></thead><tbody>` +
          (l.length ? l.map(i => `<tr><td>${esc(i.name)}</td><td>${fijo ? 'Desde ' + mes(i.month) : 'Este mes'}</td><td class="d">${eur.format(i.amount)}</td></tr>`).join('') : '<tr><td colspan="3">Sin movimientos</td></tr>') +
          `</tbody><tfoot><tr><td colspan="2">Total</td><td class="d">${eur.format(t)}</td></tr></tfoot></table>`;
      }).join('');
  } else {
    const ms = mesesAnio(), y = cur.slice(0, 4);
    const I = ms.map(m => total('ingreso', m)), G = ms.map(m => total('gasto', m));
    const ti = I.reduce((x, v) => x + v, 0), tg = G.reduce((x, v) => x + v, 0);
    tit = 'Informe del año ' + y; arch = y;
    h = `<div class="res">${caja('Ingresos', eur.format(ti))}${caja('Gastos', eur.format(tg))}${caja('Balance', eur.format(ti - tg))}${caja('Ahorro', pct(ti - tg, ti))}</div>
      <h2>Resumen por meses</h2><table><thead><tr><th>Mes</th><th class="d">Ingresos</th><th class="d">Gastos</th><th class="d">Balance</th></tr></thead><tbody>` +
      ms.map((m, k) => `<tr><td style="text-transform:capitalize">${nomMes(m)}</td><td class="d">${eur.format(I[k])}</td><td class="d">${eur.format(G[k])}</td><td class="d">${eur.format(I[k] - G[k])}</td></tr>`).join('') +
      `</tbody><tfoot><tr><td>Total</td><td class="d">${eur.format(ti)}</td><td class="d">${eur.format(tg)}</td><td class="d">${eur.format(ti - tg)}</td></tr></tfoot></table>
      <p style="color:#555;margin-top:10px">Los ingresos y gastos fijos se proyectan a los meses posteriores a su alta.</p>`;
  }
  document.getElementById('informe').innerHTML = `<h1>${tit}<small>Generado el ${hoy}</small></h1>` + h;
  const t0 = document.title; document.title = 'finanzas-informe-' + arch;
  window.addEventListener('afterprint', () => { document.title = t0; }, {once: true});
  setTimeout(() => window.print(), 50);
}
document.getElementById('csv').onclick = informeCSV;
document.getElementById('pdf').onclick = informePDF;

document.getElementById('exp').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(items, null, 2)], {type: 'application/json'}));
  a.download = 'finanzas-' + cur + '.json'; a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById('imp').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d) || !d.every(valido)) throw 0;
      if (confirm('Esto reemplazará los datos actuales. ¿Continuar?')) { items = d; save(); render(); }
    } catch (x) { alert('El archivo no es una copia válida.'); }
  };
  r.readAsText(f); e.target.value = '';
};
render();
estado();
</script>
</body>
</html>
